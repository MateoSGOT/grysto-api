# Blueprint de Render para grysto-api.
# Guía completa: C:\proyectos\DEPLOY_RENDER.md
#
# OJO: con este blueprint Render despliega SOLO en cada push a `main`
# (autoDeploy). `main` tiene que estar siempre desplegable.
services:
  - type: web
    name: grysto-api
    runtime: node
    plan: free # pasar al plan pago antes de la prueba cerrada
    # Misma zona que el cluster de Atlas (AWS / N. Virginia, us-east-1). La
    # región no se puede cambiar después de crear el servicio.
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    # node directo (sin npm) para que el SIGTERM de Render llegue al cierre ordenado.
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      # Valores fijos (no secretos).
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB_NAME
        value: grysto_prod
      # Secretos: sync:false → Render los pide al crear el servicio; nunca van
      # en el repo. Generarlos NUEVOS (no reusar los de desarrollo).
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AUTH_CODE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
